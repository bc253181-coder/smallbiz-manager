spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_TEST_NAME:smallbiz_test}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
  flyway:
    # 测试库每次启动先清空再迁移；额外加载仅用于测试的表
    clean-disabled: false
    locations: classpath:db/migration,classpath:db/testmigration

smallbiz:
  security:
    access-token-ttl: 2h
  storage:
    upload-dir: ./target/test-uploads
    private-dir: ./target/test-private
  platform:
    admin-emails: admin@platform.test
    support-wechat-id: TEST_WECHAT
    payment-assets-dir: ../assets/payment
  payment:
    mock-enabled: true
  # 定时任务（对账）在测试里直接调用
  scheduling:
    enabled: false
  # 测试用的激活码加密密钥（仅测试）
  codes:
    encryption-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
