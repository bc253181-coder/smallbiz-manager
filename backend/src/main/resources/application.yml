spring:
  application:
    name: smallbiz-backend
  config:
    # 本地开发凭据：项目根目录的 .env.dev（KEY=VALUE 格式，按 properties 读取）
    import: optional:file:../.env.dev[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:smallbiz}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # 多商户隔离：所有 @TenantId 实体的查询/写入自动带上当前商户
        tenant_identifier_resolver: com.smallbiz.tenant.TenantIdentifierResolver
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  # 在 Nginx 等反向代理之后：用 X-Forwarded-For / X-Forwarded-Proto 识别真实 IP 和 HTTPS
  # （只信任内网代理地址；登录失败限制、客服限速都按真实 IP 计算）
  forward-headers-strategy: native
  error:
    include-message: never

smallbiz:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 2h
    refresh-token-ttl: 30d
    # 刷新令牌轮换后，旧令牌在此时间内仍可再用（防止请求中断导致意外登出）
    refresh-reuse-grace: 30s
    # 生产环境（HTTPS）必须为 true
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    # 生产环境前后端同域名，不需要跨域；需要时用逗号分隔多个地址
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # 商品图片存放目录（相对于后端启动目录）；上线时改为对象存储
    upload-dir: ${UPLOAD_DIR:./uploads}
    # 付款截图等私密文件（不对外提供访问，只能通过鉴权接口读取）
    private-dir: ${PRIVATE_UPLOAD_DIR:./private-uploads}
  platform:
    # 平台管理员邮箱，逗号分隔（环境变量 PLATFORM_ADMIN_EMAILS）
    admin-emails: ${PLATFORM_ADMIN_EMAILS:}
    # 人工客服微信：只显示在本网站内，不要发布到小红书
    support-wechat-id: ${SUPPORT_WECHAT_ID:Pianzibudehaosi_1A}
    # 首次启动时从这里导入收款码图片
    payment-assets-dir: ${PAYMENT_ASSETS_DIR:../assets/payment}

  # AI 客服：没有 ANTHROPIC_API_KEY 时关闭，只用关键词匹配
  ai-support:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_SUPPORT_MODEL:claude-haiku-5-5}
    daily-limit: ${AI_SUPPORT_DAILY_LIMIT:1000}
    per-ip-daily-limit: ${AI_SUPPORT_PER_IP_DAILY_LIMIT:30}
    timeout: 20s
    # 估算费用用（美元 / 每百万 token），换模型时一起改
    input-price: ${AI_SUPPORT_INPUT_PRICE:0.10}
    cache-read-price: ${AI_SUPPORT_CACHE_READ_PRICE:0.01}
    output-price: ${AI_SUPPORT_OUTPUT_PRICE:0.50}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
