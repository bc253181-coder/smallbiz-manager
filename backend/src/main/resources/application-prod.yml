# 生产环境（SPRING_PROFILES_ACTIVE=prod）。所有密码、密钥只从环境变量读取，不写在代码里。
spring:
  flyway:
    # 生产库绝不允许 clean
    clean-disabled: true

smallbiz:
  security:
    # 生产环境必须是 HTTPS
    cookie-secure: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN