<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>

  <!-- 店铺主体 -->
  <rect x="124" y="200" width="264" height="192" rx="20" fill="#fff"/>

  <!-- 条纹遮阳棚：5 条，两端都是橙色，下沿是半圆波浪 -->
  <polygon points="112,120 169.6,120 162.4,200 100,200" fill="#f97316"/>
  <polygon points="169.6,120 227.2,120 224.8,200 162.4,200" fill="#fff"/>
  <polygon points="227.2,120 284.8,120 287.2,200 224.8,200" fill="#f97316"/>
  <polygon points="284.8,120 342.4,120 349.6,200 287.2,200" fill="#fff"/>
  <polygon points="342.4,120 400,120 412,200 349.6,200" fill="#f97316"/>
  <circle cx="131.2" cy="200" r="31.2" fill="#f97316"/>
  <circle cx="193.6" cy="200" r="31.2" fill="#fff"/>
  <circle cx="256" cy="200" r="31.2" fill="#f97316"/>
  <circle cx="318.4" cy="200" r="31.2" fill="#fff"/>
  <circle cx="380.8" cy="200" r="31.2" fill="#f97316"/>
  <rect x="104" y="112" width="304" height="12" rx="6" fill="#ea580c"/>

  <!-- 上升的柱状图 = 生意越来越好 -->
  <rect x="164" y="300" width="40" height="60" rx="10" fill="#93c5fd"/>
  <rect x="236" y="268" width="40" height="92" rx="10" fill="#3b82f6"/>
  <rect x="308" y="250" width="40" height="110" rx="10" fill="#1d4ed8"/>

  <!-- 勾 = 账目清楚 -->
  <circle cx="380" cy="374" r="54" fill="#22c55e" stroke="#fff" stroke-width="14"/>
  <path d="M354 374 L372 392 L406 356" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
