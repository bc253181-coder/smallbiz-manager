<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .wrap { padding: 72px 76px 0; }
  .eyebrow { margin-top: 56px; }
  h1 {
    margin-top: 34px;
    font-size: 136px; line-height: 1.12; letter-spacing: -2px;
  }
  h1 .red { color: var(--red); }
  .sub { margin-top: 26px; font-size: 46px; font-weight: 700; color: var(--muted); }

  /* 手机 */
  .phone {
    position: absolute; right: 70px; top: 760px;
    width: 560px; height: 1000px;
    background: var(--ink); border-radius: 76px; padding: 22px;
    transform: rotate(5deg);
    box-shadow: 0 30px 60px rgba(15,23,42,.25);
  }
  .screen { width: 100%; height: 100%; background: #f8fafc; border-radius: 58px; overflow: hidden; padding: 64px 30px 0; }
  .notch { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 150px; height: 34px; background: var(--ink); border-radius: 20px; }
  .greet { font-size: 30px; font-weight: 900; }
  .shop { font-size: 21px; color: var(--muted); margin-top: 4px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
  .kpi { background: #fff; border-radius: 22px; padding: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .kpi p { font-size: 19px; color: var(--muted); }
  .kpi b { display: block; margin-top: 6px; font-size: 32px; font-weight: 900; }
  .kpi.main { grid-column: span 2; background: var(--blue); color: #fff; }
  .kpi.main p { color: #bfdbfe; }
  .kpi.main b { font-size: 50px; }
  .bars { display: flex; align-items: flex-end; gap: 12px; height: 150px; margin-top: 18px; background: #fff; border-radius: 22px; padding: 18px; }
  .bars i { flex: 1; background: var(--blue-soft); border-radius: 8px 8px 4px 4px; }
  .bars i:last-child { background: var(--blue); }
  .alert { margin-top: 16px; background: #fff7ed; border: 2px solid #fdba74; border-radius: 20px; padding: 14px 18px; font-size: 21px; font-weight: 700; color: #9a3412; }
  .sale { margin-top: 16px; background: #fff; border-radius: 20px; padding: 14px 18px; font-size: 21px; display: flex; justify-content: space-between; }
  .sale b { color: var(--green); }

  /* 左侧卖点 */
  .points { position: absolute; left: 76px; top: 820px; display: flex; flex-direction: column; gap: 30px; }
  .points .tag { font-size: 38px; }

  .price {
    width: 330px; height: 330px; left: 300px; top: 1150px;
    background: var(--red); transform: rotate(-10deg);
    border: 8px solid #fff; outline: 5px solid var(--red);
  }
  .price .s { font-size: 34px; }
  .price .n { font-size: 96px; line-height: 1; letter-spacing: -3px; }
  .price .n span { font-size: 48px; }
  .price .t { font-size: 38px; margin-top: 4px; background: var(--yellow); color: var(--ink); padding: 2px 16px; border-radius: 12px; }

  .doodle { position: absolute; font-size: 90px; }
</style>
</head>
<body class="dots">
  <div class="wrap layer">
    <div class="brandbar"><img src="logo-mark.svg" alt="">SmallBiz Manager<small>小店进销存</small></div>
    <div class="eyebrow"><span class="tag">📒 小店老板必看</span></div>
    <h1>别再手写<br><span class="hl">记账</span>对到半夜了<span class="red">！</span></h1>
    <p class="sub">开单 · 库存 · 欠款 · 报表，一个网页全搞定</p>
  </div>

  <div class="points">
    <span class="tag">📷 扫码开单</span>
    <span class="tag">📦 库存自动算</span>
    <span class="tag">💰 欠款不漏记</span>
  </div>

  <div class="phone layer">
    <div class="notch"></div>
    <div class="screen">
      <p class="greet">早上好，小美 ☀️</p>
      <p class="shop">小美饰品店 · 经营概览</p>
      <div class="kpis">
        <div class="kpi main"><p>今日销售额</p><b>¥3,286.00</b></div>
        <div class="kpi"><p>本月毛利</p><b>¥18,920</b></div>
        <div class="kpi"><p>今日订单</p><b>42 笔</b></div>
      </div>
      <div class="bars"><i style="height:38%"></i><i style="height:52%"></i><i style="height:45%"></i><i style="height:66%"></i><i style="height:58%"></i><i style="height:80%"></i><i style="height:100%"></i></div>
      <div class="alert">⚠️ 珍珠耳钉 只剩 3 件，记得补货</div>
      <div class="sale"><span>SO-0042 · 王姐（批发）</span><b>+¥680</b></div>
    </div>
  </div>

  <div class="sticker price layer">
    <span class="s">永久会员</span>
    <span class="n"><span>¥</span>29.9</span>
    <span class="t">一次买断</span>
  </div>

  <span class="doodle" style="left:1080px; top:330px; transform:rotate(12deg)">✨</span>
  <span class="doodle" style="left:96px; top:1330px; font-size:80px">🧋</span>

  <div class="footer">手机 / 电脑 <b>打开网页就能用</b> · 不用下载 App</div>
</body>
</html>
