<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { background: #fff1f2; }
  .dots::before { background-image: radial-gradient(#fecdd3 3px, transparent 3.5px); }
  .wrap { padding: 72px 70px 0; }
  h1 { margin-top: 44px; font-size: 112px; line-height: 1.12; letter-spacing: -2px; }
  h1 .red { color: var(--red); }
  .plans { margin-top: 50px; display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 30px; align-items: stretch; }
  .plan { padding: 36px 34px; }
  .plan h3 { font-size: 42px; font-weight: 900; }
  .plan .p { margin-top: 12px; font-size: 76px; font-weight: 900; letter-spacing: -2px; }
  .plan .p small { font-size: 32px; letter-spacing: 0; color: var(--muted); font-weight: 700; }
  .plan ul { margin-top: 18px; list-style: none; font-size: 31px; line-height: 1.75; font-weight: 500; }
  .plan.free { background: #f8fafc; }
  .plan.free .p { color: var(--muted); }
  .plan.vip { background: var(--ink); color: #fff; position: relative; }
  .plan.vip .p { color: var(--yellow); }
  .plan.vip .p small { color: #cbd5e1; }
  .plan.vip ul { color: #e2e8f0; }
  .plan.vip ul b { color: #fff; }
  .ribbon { position: absolute; top: -30px; right: 26px; background: var(--red); color: #fff; font-weight: 900; font-size: 32px; padding: 8px 22px; border-radius: 14px; border: 4px solid var(--ink); transform: rotate(4deg); }
  .steps { margin-top: 52px; padding: 36px 40px; }
  .steps h2 { font-size: 48px; font-weight: 900; }
  .step { margin-top: 24px; display: flex; align-items: center; gap: 24px; font-size: 38px; font-weight: 700; }
  .step i { flex: none; width: 70px; height: 70px; border-radius: 50%; background: var(--blue); color: #fff; font-style: normal; font-weight: 900; font-size: 40px; display: flex; align-items: center; justify-content: center; border: 4px solid var(--ink); }
  .step span.url { background: var(--blue-soft); color: var(--blue-dark); padding: 2px 14px; border-radius: 12px; font-weight: 900; }
  .milk { position: absolute; right: 74px; top: 210px; font-size: 40px; font-weight: 900; text-align: center; transform: rotate(8deg); }
  .milk div { font-size: 120px; line-height: 1; }
</style>
</head>
<body class="dots">
  <div class="wrap layer">
    <div class="brandbar"><img src="logo-mark.svg" alt="">SmallBiz Manager<small>小店进销存</small></div>
    <h1>一杯奶茶钱<br><span class="hl">永久</span>用下去<span class="red">！</span></h1>

    <div class="plans">
      <div class="card plan free">
        <h3>免费版</h3>
        <div class="p">¥0</div>
        <ul>
          <li>✔ 2 家店</li>
          <li>✔ 3 个商品</li>
          <li>✔ 先试试顺不顺手</li>
        </ul>
      </div>
      <div class="card plan vip">
        <span class="ribbon">没有月费</span>
        <h3>⭐ 高级永久会员</h3>
        <div class="p">¥29.9 <small>一次买断</small></div>
        <ul>
          <li>✔ <b>商品数量不限</b></li>
          <li>✔ <b>全部功能</b>都能用</li>
          <li>✔ 报表 · 导出 · 高级模板</li>
          <li>✔ 马来西亚 RM19.9</li>
        </ul>
      </div>
    </div>

    <div class="card steps">
      <h2>📮 3 步开通</h2>
      <div class="step"><i>1</i>浏览器打开 <span class="url">smallbiz.cn</span> 注册</div>
      <div class="step"><i>2</i>在本店拍下「永久会员激活码」</div>
      <div class="step"><i>3</i>到网站「会员」页输入激活码 🎉</div>
    </div>
  </div>

  <div class="milk layer"><div>🧋</div>≈ 一杯奶茶</div>

  <div class="footer">拍下后发激活码 · <b>输入即开通</b></div>
</body>
</html>
